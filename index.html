<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOKIKORI — Visual Storytelling & Commercial Production</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f4f4f5;
            --text: #09090b;
            --muted: #71717a;
            --accent: #000000;
            --border: #e4e4e7;
            --danger: #ef4444;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0a0a0a;
                --surface: #141414;
                --text: #f3f3f3;
                --muted: #888888;
                --accent: #ffffff;
                --border: #222222;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            letter-spacing: 0.02em;
            padding: 60px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: background 0.3s, color 0.3s;
        }

        header {
            max-width: 1600px;
            margin: 0 auto 60px auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 30px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .brand h1 {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .brand p {
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .nav-tabs {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            text-transform: uppercase;
            transition: color 0.3s;
            position: relative;
        }

        .tab-btn:hover, .tab-btn.active {
            color: var(--accent);
            font-weight: 500;
        }

        .del-section-btn {
            display: none;
            background: none;
            border: none;
            color: var(--danger);
            font-size: 0.7rem;
            margin-left: 4px;
            cursor: pointer;
        }
        body.admin-mode .tab-btn.custom-tab .del-section-btn {
            display: inline;
        }

        main {
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--surface);
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 4/5;
            position: relative;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card img, .card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-meta {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover .card-meta {
            opacity: 1;
        }

        .card-title {
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .del-card-btn {
            display: none;
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(239, 68, 68, 0.9);
            color: #fff;
            border: none;
            width: 28px; height: 28px;
            border-radius: 50%;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 10;
            align-items: center;
            justify-content: center;
        }
        body.admin-mode .del-card-btn {
            display: flex;
        }

        .admin-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 15px 30px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        }
        body.admin-mode .admin-bar { display: flex; }

        .btn {
            background: var(--accent); color: var(--bg); border: none;
            padding: 8px 16px; border-radius: 4px;
            font-size: 0.8rem; font-weight: 500; cursor: pointer;
            letter-spacing: 0.05em; text-transform: uppercase;
        }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--bg);
            border: 1px solid var(--border);
            width: 90%; max-width: 1200px; height: 85vh;
            border-radius: 8px; padding: 30px;
            display: flex; flex-direction: column;
        }
        .media-picker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            overflow-y: auto;
            margin-top: 20px;
            flex-grow: 1;
            padding-right: 10px;
        }
        .picker-item {
            aspect-ratio: 4/5;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            background: var(--surface);
            position: relative;
        }
        .picker-item:hover { border-color: var(--accent); }
        .picker-item img, .picker-item video { width: 100%; height: 100%; object-fit: cover; }
        .picker-title {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7); color: #fff; font-size: 0.65rem;
            padding: 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .sortable-ghost { opacity: 0.3; }

        @media (max-width: 768px) {
            body { padding: 20px; }
            header { flex-direction: column; align-items: flex-start; gap: 20px; }
        }
    </style>
</head>

    <header>
        <div class="brand-container">
            <img src="portfolio my photo.png" alt="Ayzat Tanibergen" class="avatar">
            <div class="brand">
                <h1>YOKIKORI</h1>
                <p>Visual Storytelling & Commercial Production</p>
            </div>
        </div>
        <div class="nav-tabs" id="nav-tabs">
            <button class="tab-btn active" onclick="filterCategory('all', this)">All</button>
            <button class="tab-btn" onclick="filterCategory('fashion', this)">Fashion</button>
            <button class="tab-btn" onclick="filterCategory('brands', this)">Brands</button>
            <button class="tab-btn" onclick="filterCategory('backstage', this)">Backstage</button>
            <button class="tab-btn" onclick="filterCategory('art', this)">Art</button>
        </div>
    </header>

    <main>
        <div class="grid" id="portfolio-grid"></div>
    </main>

    <div class="admin-bar" id="admin-bar">

        <div style="display: flex; gap: 10px;">

            <button class="btn btn-outline" onclick="openMediaLibrary()">📁 Лаборатория файлов (243)</button>
            <button class="btn btn-outline" onclick="exitAdmin()">Выйти</button>
            <button class="btn" onclick="saveLayout()">Сохранить</button>
        </div>
    </div>

    <div class="modal" id="media-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center;">

                <button class="btn btn-outline" onclick="closeMediaLibrary()">Закрыть</button>
            </div>
            <div class="media-picker-grid" id="media-picker"></div>
        </div>
    </div>

        let sortableInstance = null;
        let activeCategory = 'all';

        window.addEventListener('DOMContentLoaded', () => {
            const portfolioGrid = document.getElementById('portfolio-grid');
            INITIAL_CARDS.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.category = item.category;

                let mediaEl = item.type === 'video' 
                    ? `<video src="${item.path}" autoplay muted loop playsinline></video>`
                    : `<img src="${item.path}" alt="${item.title}" loading="lazy">`;

                card.innerHTML = `
                    <button class="del-card-btn" onclick="this.closest('.card').remove()">✕</button>
                    ${mediaEl}
                    <div class="card-meta"><div class="card-title">${item.title}</div></div>
                `;
                portfolioGrid.appendChild(card);
            });

            const pickerGrid = document.getElementById('media-picker');
            ALL_MEDIA_FILES.forEach(item => {
                const div = document.createElement('div');
                div.className = 'picker-item';
                div.onclick = () => addSelectedMedia(item.path, item.type, item.title, item.category);

                let content = item.type === 'video'
                    ? `<video src="${item.path}" muted></video>`
                    : `<img src="${item.path}" loading="lazy">`;

                div.innerHTML = `${content}<div class="picker-title">${item.title}</div>`;
                pickerGrid.appendChild(div);
            });

            const params = new URLSearchParams(window.location.search);
            if (params.has('admin') || window.location.hash === '#admin') {
                let token = localStorage.getItem('gh_token');
                if (!token) {
                    token = prompt("Введите GitHub Token для режима админа:");
                    if (token) localStorage.setItem('gh_token', token);
                }
                if (token) {
                    document.body.classList.add('admin-mode');
                    sortableInstance = new Sortable(portfolioGrid, {
                        animation: 150,
                        ghostClass: 'sortable-ghost'
                    });
                }
            }
        });

        function exitAdmin() {
            window.location.href = window.location.pathname;
        }

        function createNewSection() {
            const name = prompt("Название нового раздела:");
            if (!name) return;
            const slug = name.toLowerCase().replace(/\s+/g, '-');

            const tabsContainer = document.getElementById('nav-tabs');
            const btn = document.createElement('button');
            btn.className = 'tab-btn custom-tab';
            btn.setAttribute('onclick', `filterCategory('${slug}', this)`);
            btn.innerHTML = `${name} <button class="del-section-btn" onclick="event.stopPropagation(); removeSection('${slug}', this)">[x]</button>`;
            tabsContainer.appendChild(btn);
        }

        function removeSection(slug, btnEl) {
            if (!confirm("Удалить раздел?")) return;
            document.querySelectorAll(`.card[data-category="${slug}"]`).forEach(c => c.remove());
            btnEl.closest('.tab-btn').remove();
            filterCategory('all', document.querySelector('.tab-btn'));
        }

        function filterCategory(cat, el) {
            activeCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');

            document.querySelectorAll('.card').forEach(card => {
                if (cat === 'all' || card.dataset.category === cat) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function openMediaLibrary() {
            document.getElementById('media-modal').style.display = 'flex';
        }

        function closeMediaLibrary() {
            document.getElementById('media-modal').style.display = 'none';
        }

        function addSelectedMedia(src, type, title, fileCategory) {
            const targetCat = activeCategory === 'all' ? fileCategory : activeCategory;
            const grid = document.getElementById('portfolio-grid');
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.category = targetCat;

            let mediaEl = type === 'video' 
                ? `<video src="${src}" autoplay muted loop playsinline></video>`
                : `<img src="${src}" alt="${title}" loading="lazy">`;

            card.innerHTML = `
                <button class="del-card-btn" onclick="this.closest('.card').remove()">✕</button>
                ${mediaEl}
                <div class="card-meta"><div class="card-title">${title}</div></div>
            `;
            grid.prepend(card);
            closeMediaLibrary();
        }

        function saveLayout() {
            alert('Изменения зафиксированы!');
        }
    </script>
