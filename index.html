<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOKIKORI — Visual Storytelling</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #fafafa;
            --text: #111111;
            --muted: #767676;
            --accent: #000000;
            --border: #eaeaea;
            --danger: #ff3b30;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0c0c0c;
                --surface: #161616;
                --text: #f5f5f7;
                --muted: #8e8e93;
                --accent: #ffffff;
                --border: #262626;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 300;
            letter-spacing: -0.01em;
            padding: 50px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: background 0.3s, color 0.3s;
        }

        header {
            max-width: 1400px;
            margin: 0 auto 50px auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 24px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar-wrap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--surface);
        }
        .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }

        .brand-info h1 {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .brand-info p {
            color: var(--muted);
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .nav-container {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            text-transform: uppercase;
            transition: color 0.2s;
        }
        .tab-btn:hover, .tab-btn.active { color: var(--accent); font-weight: 500; }

        main {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        /* Увеличенные отступы между карточками для легкого восприятия */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 36px;
        }

        .card {
            background: var(--surface);
            border-radius: 6px;
            overflow: hidden;
            aspect-ratio: 4/5;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card:hover { transform: translateY(-4px); }
        .card img, .card video { width: 100%; height: 100%; object-fit: cover; }

        .card-meta {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 24px;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .card:hover .card-meta { opacity: 1; }
        .card-tag {
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #ffffff;
            font-weight: 400;
        }

        /* Соцсеть-админка (панель управления профилем) */
        .social-admin-panel {
            position: fixed;
            top: 0; right: -420px;
            width: 400px; height: 100vh;
            background: var(--bg);
            border-left: 1px solid var(--border);
            box-shadow: -10px 0 40px rgba(0,0,0,0.1);
            z-index: 3000;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column;
            padding: 30px;
        }
        .social-admin-panel.open { right: 0; }

        .admin-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px;
        }
        .admin-header h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.1em; }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 6px;
            padding: 30px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 20px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .drop-zone.dragover { border-color: var(--accent); color: var(--accent); }

        .blog-editor {
            flex-grow: 1;
            display: flex; flex-direction: column; gap: 15px;
            overflow-y: auto;
        }
        .blog-input {
            background: var(--surface); border: 1px solid var(--border);
            color: var(--text); padding: 12px; border-radius: 4px;
            font-family: inherit; font-size: 0.85rem; width: 100%;
        }
        textarea.blog-input { resize: vertical; min-height: 120px; }

        .btn {
            background: var(--accent); color: var(--bg); border: none;
            padding: 12px 20px; border-radius: 4px; font-size: 0.75rem;
            font-weight: 500; cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em;
            width: 100%; text-align: center;
        }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

        .profile-trigger {
            background: none; border: 1px solid var(--border); color: var(--text);
            padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.08em;
        }

        @media (max-width: 768px) {
            body { padding: 20px; }
            header { flex-direction: column; align-items: flex-start; gap: 20px; }
            .social-admin-panel { width: 100%; right: -100%; }
        }
    </style>
</head>

    <main>

    <div class="social-admin-panel" id="admin-panel">

        <div style="margin-bottom: 20px;">
            <label style="font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 8px; text-transform: uppercase;">Загрузка медиа (Drag & Drop)</label>

                <input type="file" id="file-input" style="display:none" multiple accept="image/*,video/*" onchange="handleFileSelect(event)">
            </div>
        </div>

        <div class="blog-editor">
            <label style="font-size: 0.75rem; color: var(--muted); text-transform: uppercase;">Создать пост / Запись в блог</label>
            <input type="text" class="blog-input" id="blog-title" placeholder="Заголовок поста...">
            <textarea class="blog-input" id="blog-text" placeholder="Текст записи..."></textarea>
            <button class="btn" onclick="publishBlogPost()">Опубликовать в блог</button>
        </div>
    </div>

        window.addEventListener('DOMContentLoaded', () => {
            renderFeed('all');

            // Авторизация по руту ?admin
            const params = new URLSearchParams(window.location.search);
            if (params.has('admin') || window.location.hash === '#admin') {
                let token = localStorage.getItem('gh_token');
                if (!token) {
                    token = prompt("Введите GitHub Token для доступа к профилю:");
                    if (token) localStorage.setItem('gh_token', token);
                }
                if (token) {
                    document.getElementById('admin-trigger').style.display = 'block';
                }
            }
        });

        function toggleAdminPanel() {
            document.getElementById('admin-panel').classList.toggle('open');
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(el) el.classList.add('active');
            renderFeed(cat);
        }

        // Умная выдача ленты: первые посты топ, далее рандомные серии
        function renderFeed(category) {
            const grid = document.getElementById('portfolio-grid');
            grid.innerHTML = '';

            if (category === 'blog') {
                // Отображение постов блога
                const posts = JSON.parse(localStorage.getItem('blog_posts') || '[]');
                if (posts.length === 0) {
                grid.innerHTML = '<div style="color: var(--muted); font-size: 0.85rem;">В блоге пока нет записей. Откройте панель профиля, чтобы создать пост.</div>';
                    return;
                }
                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.padding = '30px';
                    card.style.display = 'flex';
                    card.style.flexDirection = 'column';
                    card.style.justifyContent = 'center';
                    card.innerHTML = `
                        <h3 style="font-size: 1.1rem; font-weight: 500; margin-bottom: 12px;">${post.title}</h3>
                        <p style="font-size: 0.85rem; color: var(--muted); line-height: 1.6;">${post.text}</p>
                        <span style="font-size: 0.65rem; color: var(--muted); margin-top: 20px;">${post.date}</span>
                    `;
                    grid.appendChild(card);
                });
                return;
            }

            let items = category === 'all' ? [...ALL_MEDIA] : ALL_MEDIA.filter(m => m.category === category);

            // Специфичное требование для вкладки ALL: первые несколько топ, потом рандом
            if (category === 'all') {
                const topPaths = [
                    '01_Main_Fashion_Commercial/Video by kkkorlan [DIJQLXFIGu1].mp4',
                    '02_Backstage_And_Process/Video by kkkorlan [DPtGmaEiL_z].mp4',
                    '03_Brand_Collaborations/@offbeatkz/2026-07-04_06-33-31_UTC.mp4',
                    '2026-10-10_14-02-37_UTC_18.jpg',
                    '2025-12-22_17-12-46_UTC_1.jpg'
                ];
                
                let topItems = topPaths.map(p => ALL_MEDIA.find(m => m.path === p)).filter(Boolean);
                let otherItems = ALL_MEDIA.filter(m => !topPaths.includes(m.path));
                
                // Перемешиваем остальные для получения рандомных серий
                otherItems.sort(() => Math.random() - 0.5);
                items = [...topItems, ...otherItems];
            } else {
                items.sort(() => Math.random() - 0.5);
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                let mediaEl = item.type === 'video'
                    ? `<video src="${item.path}" autoplay muted loop playsinline preload="metadata"></video>`
                    : `<img src="${item.path}" alt="${item.tag}" loading="lazy">`;

                card.innerHTML = `
                    ${mediaEl}
                    <div class="card-meta"><div class="card-tag">${item.tag}</div></div>
                `;
                grid.appendChild(card);
            });
        }

        // Drag & Drop функции
        function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('dragover'); }
        function handleDragLeave(e) { e.currentTarget.classList.remove('dragover'); }
        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
            const files = e.dataTransfer.files;
            processFiles(files);
        }
        function handleFileSelect(e) {
            const files = e.target.files;
            processFiles(files);
        }
        function processFiles(files) {
            alert(`Загружено файлов: ${files.length}. (В режиме соцсети файлы готовы к публикации в ленту).`);
        }

        // Управление блогом
        function publishBlogPost() {
            const title = document.getElementById('blog-title').value;
            const text = document.getElementById('blog-text').value;
            if(!title || !text) {
                alert('Заполните заголовок и текст поста');
                return;
            }
            const posts = JSON.parse(localStorage.getItem('blog_posts') || '[]');
            posts.unshift({ title, text, date: new Date().toLocaleDateString() });
            localStorage.setItem('blog_posts', JSON.stringify(posts));
            
            document.getElementById('blog-title').value = '';
            document.getElementById('blog-text').value = '';
            alert('Пост успешно опубликован в блог!');
            toggleAdminPanel();
        }
    </script>
