<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yokikori / Korlan</title>
<style>
    :root {
        --bg: #080808;
        --card-bg: #121212;
        --border: #1f1f1f;
        --text: #f5f5f7;
        --muted: #777;
        --accent: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.4;
        padding: 50px 24px;
        -webkit-font-smoothing: antialiased;
    }
    body.admin-mode::before {
        content: 'ADMIN MODE';
        position: fixed; top: 12px; right: 12px;
        background: #fbc02d; color: #000;
        padding: 4px 10px; border-radius: 4px;
        font-size: 0.7rem; font-weight: 700;
        letter-spacing: 0.14em; z-index: 9999;
    }

    /* ─── Шапка yokikori / Korlan 50 / 50 ─── */
    header { max-width: 1600px; margin: 0 auto 50px; border-bottom: 1px solid var(--border); padding-bottom: 30px; }
    .brand-split { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 38px; }
    .brand-half { text-align: center; min-width: 0; }
    .brand-half h1 {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: clamp(1.5rem, 4vw, 2.4rem);
        font-weight: 500; letter-spacing: -0.04em; line-height: 1;
        color: var(--text); white-space: nowrap;
    }
    .brand-half span {
        display: block; margin-top: 9px; font-size: 0.68rem;
        letter-spacing: 0.14em; color: var(--muted); text-transform: lowercase;
    }
    .brand-sep { color: var(--muted); opacity: .55; font-size: 1.1rem; padding: 0 22px; user-select: none; }
    @media (max-width: 620px) { .brand-sep { padding: 0 10px; } .brand-half span { display: none; } }

    /* ─── Навигация ─── */
    .nav-tabs { display: flex; gap: 12px; flex-wrap: wrap; }
    .tab-btn {
        background: transparent; border: 1px solid var(--border); color: var(--muted);
        padding: 8px 20px; border-radius: 20px; cursor: pointer;
        font-family: inherit; font-size: 0.85rem; text-transform: lowercase;
        transition: all 0.25s ease;
    }
    .tab-btn:hover, .tab-btn.active {
        border-color: var(--accent); color: var(--accent); background: rgba(255,255,255,0.03);
    }

    /* ─── Админ-панель ─── */
    .admin-panel {
        display: none; background: #111; border: 1px solid #333;
        padding: 24px; border-radius: 12px; max-width: 1600px;
        margin: 0 auto 40px; gap: 18px; flex-direction: column;
    }
    body.admin-mode .admin-panel { display: flex; }
    .admin-panel h3 { font-size: 0.95rem; font-weight: 500; text-transform: lowercase; }
    .admin-section { display: flex; flex-direction: column; gap: 10px; }
    .admin-section h4 {
        font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--muted); font-weight: 500;
    }
    .post-creator { display: flex; flex-direction: column; gap: 14px; }
    .post-creator textarea, .admin-section textarea {
        width: 100%; background: #181818; border: 1px solid var(--border); color: #fff;
        padding: 14px; border-radius: 8px; font-family: inherit; font-size: 0.9rem;
        resize: vertical; min-height: 80px; line-height: 1.5;
    }
    .creator-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .btn {
        background: #fff; color: #000; border: none; padding: 10px 20px;
        border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: 500;
        font-size: 0.85rem; text-transform: lowercase; transition: 0.2s;
    }
    .btn:hover { opacity: 0.88; }
    .btn.save-gh { background: #2e7d32; color: #fff; }
    .btn.danger { background: #d32f2f; color: #fff; }
    .btn.secondary { background: #222; color: #fff; border: 1px solid #444; }
    .album-creator { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .album-creator input {
        background: #181818; border: 1px solid #444; color: #fff;
        padding: 10px 16px; border-radius: 6px; font-family: inherit;
        font-size: 0.85rem; min-width: 200px;
    }
    .album-creator input:focus { outline: none; border-color: var(--accent); }

    .dropzone {
        border: 2px dashed #444; padding: 24px; text-align: center;
        border-radius: 8px; color: var(--muted); cursor: pointer;
        background: #141414; transition: 0.2s; font-size: 0.85rem;
    }
    .dropzone.dragover { border-color: #fff; background: #222; color: #fff; }

    /* ─── Сетка ─── */
    .portfolio-grid { columns: 3 360px; column-gap: 32px; }
    .album-section { max-width: 1600px; margin: 0 auto 50px; }
    .album-title {
        display: flex; align-items: center; gap: 14px;
        font-size: 0.78rem; letter-spacing: 0.14em; text-transform: lowercase;
        color: var(--muted); margin-bottom: 22px; padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
    }
    .album-del-btn {
        background: transparent; border: 1px solid #3a1a1a; color: #e57373;
        padding: 4px 10px; border-radius: 4px; cursor: pointer;
        font-family: inherit; font-size: 0.68rem; text-transform: lowercase;
    }
    .album-del-btn:hover { background: #3a1a1a; color: #fff; }

    .card {
        background: var(--card-bg); border-radius: 8px; overflow: hidden;
        position: relative; border: 1px solid var(--border);
        margin-bottom: 32px; break-inside: avoid; transition: border-color 0.3s;
    }
    .card:hover { border-color: #333; }
    .card img, .card video { width: 100%; height: auto; display: block; object-fit: contain; }
    .card-meta {
        padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .tag-badge {
        font-size: 0.72rem; color: var(--muted); background: #181818;
        padding: 4px 10px; border-radius: 4px; letter-spacing: 0.4px; text-transform: lowercase;
    }

    /* ─── Звёзды: только в админке ─── */
    .card-stars { display: none; gap: 1px; font-size: 0.9rem; user-select: none; }
    body.admin-mode .card-stars { display: inline-flex; }
    .card-stars .star { cursor: pointer; color: #2a2a2a; transition: color 0.15s; }
    .card-stars .star.filled { color: #fbc02d; }
    .card-stars .star:hover { color: #ffd54f; }

    .del-card-btn {
        position: absolute; top: 14px; right: 14px;
        background: rgba(0,0,0,0.85); color: #fff; border: none;
        width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
        display: none; align-items: center; justify-content: center; z-index: 10;
    }
    body.admin-mode .del-card-btn { display: flex; }

    /* ─── About ─── */
    .about-section {
        max-width: 760px; margin: 0 auto 60px; padding: 40px;
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 12px; display: none;
    }
    .about-section.active { display: block; }
    .about-content { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
    .about-avatar {
        width: 140px; height: 140px; border-radius: 50%;
        object-fit: cover; border: 1px solid #333; flex-shrink: 0;
    }
    .about-text-rendered {
        flex: 1; min-width: 200px; white-space: pre-wrap;
        line-height: 1.75; color: var(--muted); font-size: 0.95rem;
    }

    /* ─── Blog / Feed ─── */
    .blog-feed { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
    .blog-post {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 12px; padding: 22px; position: relative;
    }
    .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .post-avatar {
        width: 38px; height: 38px; border-radius: 50%;
        object-fit: cover; border: 1px solid #333; flex-shrink: 0;
    }
    .post-name { font-weight: 500; font-size: 0.9rem; }
    .post-date { color: var(--muted); font-size: 0.72rem; margin-left: auto; letter-spacing: 0.06em; }
    .post-text { font-size: 0.95rem; margin-bottom: 14px; white-space: pre-wrap; line-height: 1.55; }
    .hashtag { color: #64b5f6; cursor: pointer; }
    .hashtag:hover { text-decoration: underline; }
    .post-media { margin-top: 8px; }
    .post-media img, .post-media video {
        width: 100%; height: auto; border-radius: 8px; display: block; object-fit: contain;
    }
    .post-actions {
        display: none; gap: 8px; margin-top: 14px; padding-top: 14px;
        border-top: 1px solid var(--border);
    }
    body.admin-mode .post-actions { display: flex; }
    .post-actions button {
        background: transparent; border: 1px solid #333; color: var(--muted);
        padding: 6px 14px; border-radius: 6px; cursor: pointer;
        font-family: inherit; font-size: 0.75rem; text-transform: lowercase;
    }
    .post-actions button:hover { color: #fff; border-color: #555; }
    .post-actions button.del { color: #e57373; border-color: #3a1a1a; }
    .post-actions button.del:hover { background: #3a1a1a; color: #fff; }

    /* ─── Модалка медиатеки ─── */
    .modal {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
        z-index: 1000; justify-content: center; align-items: center; padding: 30px;
    }
    .modal-content {
        background: #141414; width: 100%; max-width: 1100px;
        max-height: 85vh; border-radius: 12px; display: flex;
        flex-direction: column; border: 1px solid #333; overflow: hidden;
    }
    .modal-header {
        padding: 18px 22px; border-bottom: 1px solid #333;
        display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h3 { font-size: 0.9rem; font-weight: 500; text-transform: lowercase; }
    .modal-body {
        padding: 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 26px;
    }
    .folder-group h4 {
        margin-bottom: 12px; color: var(--muted); font-size: 0.78rem;
        text-transform: lowercase; letter-spacing: 0.08em; font-weight: 500;
    }
    .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .picker-item {
        background: #1a1a1a; border-radius: 6px; overflow: hidden;
        cursor: pointer; border: 1px solid #222; transition: 0.2s; position: relative;
    }
    .picker-item:hover { border-color: #fff; }
    .picker-item img { width: 100%; height: 120px; object-fit: cover; display: block; }
    .picker-video {
        height: 120px; display: flex; align-items: center; justify-content: center;
        color: #555; font-size: 1.4rem; background: #0f0f0f;
    }

    .sortable-ghost { opacity: 0.35; }
</style>
</head>
<body>

<header>
    <div class="brand-split">
        <div class="brand-half">
            <h1>yokikori</h1>
            <span>visual production</span>
        </div>
        <div class="brand-sep">/</div>
        <div class="brand-half">
            <h1>Korlan</h1>
            <span>commercial &amp; fashion production</span>
        </div>
    </div>

    <nav class="nav-tabs" id="nav-tabs">
        <button class="tab-btn active" data-tab="all" onclick="switchTab('all', this)">all</button>
        <button class="tab-btn" data-tab="fashion" onclick="switchTab('fashion', this)">fashion</button>
        <button class="tab-btn" data-tab="backstage" onclick="switchTab('backstage', this)">backstage</button>
        <button class="tab-btn" data-tab="brands" onclick="switchTab('brands', this)">brands</button>
        <button class="tab-btn" data-tab="art" onclick="switchTab('art', this)">art &amp; personal</button>
        <button class="tab-btn" data-tab="blog" onclick="switchTab('blog', this)">feed</button>
        <button class="tab-btn" data-tab="about" onclick="switchTab('about', this)">about</button>
    </nav>
</header>

<!-- Скрытая админ-панель -->
<div class="admin-panel" id="admin-panel">
    <h3>⚡ администратор — прямой коммит в github</h3>

    <div class="admin-section">
        <h4>about me</h4>
        <textarea id="admin-about" rows="3" oninput="aboutText = this.value; renderAbout();"></textarea>
    </div>

    <div class="admin-section">
        <h4>новый пост / медиа</h4>
        <div class="post-creator">
            <textarea id="post-text" placeholder="текст нового поста, хэштеги (#fashion #brands #art)..."></textarea>
            <div class="dropzone" id="dropzone"
                 ondragover="handleDragOver(event)"
                 ondragleave="handleDragLeave(event)"
                 ondrop="handleDrop(event)"
                 onclick="openMediaLibrary()">
                📎 перетащите файл сюда или нажмите, чтобы выбрать из медиатеки
            </div>
            <div class="creator-controls">
                <select id="post-category" class="btn secondary">
                    <option value="art">art &amp; personal</option>
                    <option value="brands">brands</option>
                    <option value="fashion">fashion</option>
                    <option value="backstage">backstage</option>
                </select>
                <input id="post-album" placeholder="альбом (опционально)" style="background:#181818;border:1px solid #444;color:#fff;padding:10px 16px;border-radius:6px;font-family:inherit;font-size:0.85rem;min-width:160px;">
                <button class="btn" onclick="publishPost()">+ добавить</button>
            </div>
        </div>
    </div>

    <div class="admin-section">
        <h4>создать альбом</h4>
        <div class="album-creator">
            <select id="album-section" class="btn secondary">
                <option value="fashion">fashion</option>
                <option value="backstage">backstage</option>
                <option value="brands">brands</option>
                <option value="art">art &amp; personal</option>
            </select>
            <input id="album-name" placeholder="название альбома">
            <button class="btn" onclick="createAlbum()">+ альбом</button>
        </div>
    </div>

    <div class="creator-controls" style="margin-top:8px;">
        <button class="btn save-gh" onclick="saveToGitHub()">💾 сохранить и закоммитить на github</button>
        <button class="btn danger" onclick="logoutAdmin()" style="margin-left:auto;">выйти из админки</button>
    </div>
</div>

<!-- About -->
<section class="about-section" id="about-section">
    <div class="about-content">
        <img class="about-avatar"
             src="03_Brand_Collaborations/@titre_3/Titre backstage/2026-10-10_14-02-37_UTC_18.jpg"
             alt="" loading="lazy">
        <div class="about-text-rendered" id="about-text-rendered"></div>
    </div>
</section>

<!-- Контейнер портфолио -->
<main id="portfolio-main"></main>

<!-- Лента блога -->
<div class="blog-feed" id="blog-feed" style="display:none;"></div>

<!-- Модалка медиатеки -->
<div class="modal" id="media-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>медиатека — все папки репозитория</h3>
            <button class="btn secondary" onclick="closeMediaLibrary()">закрыть</button>
        </div>
        <div class="modal-body" id="folder-picker-body"></div>
    </div>
</div>

<!-- Данные сайта (перезаписываются при коммите) -->

   ══════════════════════════════════════════════════════════════ */
function J(dir, base, from, to) {
    const out = [];
    for (let i = from; i <= to; i++) out.push(dir + '/' + base + '_' + i + '.jpg');
    return out;
}
function M(dir, names) { return names.map(n => dir + '/' + n + '.mp4'); }
function T(path, type, stars) { return { p: path, t: type, s: stars || 2 }; }
function TI(paths, stars) { return paths.map(p => T(p, 'video', stars)); }
function PI(paths, stars) { return paths.map(p => T(p, 'image', stars)); }

   ВСЕ ПАПКИ РЕПОЗИТОРИЯ (242 файла)

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function shuffle(arr) {
    const r = arr.slice();
    for (let i = r.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
}

/* ══════════════════════════════════════════════════════════════
   ЛЕНТА "ALL" — топ-6 по звёздам + случайные блоки по альбомам
   ══════════════════════════════════════════════════════════════ */
function buildAllFeed(items) {
    if (items.length <= 6) return items.slice();

    const byStars = items.slice().sort((a, b) => b.stars - a.stars);
    const top = byStars.slice(0, 6);
    const topSet = new Set(top.map(i => i.path));
    const rest = items.filter(i => !topSet.has(i.path));

    /* группируем остаток по альбомам */
    const groups = {};
    rest.forEach(it => {
        const key = (it.category || 'other') + '::' + (it.album || 'other');
        (groups[key] = groups[key] || []).push(it);
    });

    const chunks = [];
    Object.values(groups).forEach(g => {
        const s = shuffle(g);
        let i = 0;
        while (i < s.length) {
            const size = 2 + Math.floor(Math.random() * 2);
            chunks.push(s.slice(i, i + size));
            i += size;
        }
    });

    const mixed = [];
    shuffle(chunks).forEach(c => mixed.push.apply(mixed, c));

    return top.concat(mixed);
}

function makeCard(item, idx) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.i = idx;

    const mediaEl = item.type === 'video'
        ? '<video src="' + item.path + '" muted loop playsinline preload="metadata"></video>'
        : '<img src="' + item.path + '" loading="lazy" alt="">';

    let starsHtml = '<span class="card-stars">';
    for (let i = 1; i <= 5; i++) {
        starsHtml += '<span class="star ' + (i <= item.stars ? 'filled' : 'empty') +
                     '" onclick="setRating(' + idx + ',' + i + ')">★</span>';
    }
    starsHtml += '</span>';

    card.innerHTML =
        '<button class="del-card-btn" onclick="deleteCard(' + idx + ')">✕</button>' +
        mediaEl +
        '<div class="card-meta">' +
            '<span class="tag-badge">#' + escapeHtml(item.category) + '</span>' +
            starsHtml +
        '</div>';

    return card;
}

    e.preventDefault();

    const file = files[0];
    const reader = new FileReader();

        selectedFileForPost = {
            path: evt.target.result,   /* data URL — работает локально, при коммите загрузится в репо */

    };
    reader.readAsDataURL(file);
}

/* ══════════════════════════════════════════════════════════════
   VIDEO OBSERVER (перформанс для 242+ видео)
   ══════════════════════════════════════════════════════════════ */
let videoObserver = null;
function observeVideos() {
    if (videoObserver) videoObserver.disconnect();
    videoObserver = new IntersectionObserver(entries => {
        entries.forEach(e => {
            if (e.isIntersecting) e.target.play().catch(() => {});
            else e.target.pause();
        });
    }, { rootMargin: '150px' });

    document.querySelectorAll('.card video').forEach(v => {
        v.muted = true;
        v.loop = true;
        v.playsInline = true;
        videoObserver.observe(v);
    });
}

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */
async function saveToGitHub() {
    const token = localStorage.getItem('gh_pat_token');
    if (!token) {
        alert('ошибка: токен github не найден. зайдите через /#admin.');
        return;
    }

    let repoOwner = localStorage.getItem('gh_repo_owner');
    let repoName  = localStorage.getItem('gh_repo_name');

    if (!repoOwner) {
        repoOwner = prompt('github username:');
        if (repoOwner) localStorage.setItem('gh_repo_owner', repoOwner.trim());
    }
    if (!repoName) {
        repoName = prompt('имя репозитория (repository name):');
        if (repoName) localStorage.setItem('gh_repo_name', repoName.trim());
    }
    if (!repoOwner || !repoName) return;

    /* загрузка data-url медиа в репозиторий */
    await uploadPendingMedia(token, repoOwner, repoName);

    /* вписываем актуальные данные в site-data */
    document.getElementById('site-data').textContent = JSON.stringify({
        portfolio: portfolioItems,
        blog: blogPosts,
        albums: customAlbums,
        about: aboutText
    });

    const updatedCode = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    const apiUrl = 'https://api.github.com/repos/' + repoOwner + '/' + repoName + '/contents/index.html';

    try {
        const getRes = await fetch(apiUrl, { headers: { 'Authorization': 'token ' + token } });
        if (!getRes.ok) {
            const e = await getRes.json();
            alert('ошибка github: ' + (e.message || getRes.status));
            return;
        }
        const fileData = await getRes.json();

        const putRes = await fetch(apiUrl, {
            method: 'PUT',
            headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: 'Korlan Portfolio — update content',
                content: btoa(unescape(encodeURIComponent(updatedCode))),
                sha: fileData.sha
            })
        });

        if (putRes.ok) {
            alert('🚀 закоммичено на github! изменения применятся на сайте через минуту.');
        } else {
            const err = await putRes.json();
            alert('ошибка github: ' + err.message);
        }
    } catch (e) {
        alert('ошибка соединения: ' + e.message);
    }
}

async function uploadPendingMedia(token, owner, repo) {
    const pending = [];
    portfolioItems.forEach(it => { if (it.path.startsWith('data:')) pending.push(it); });
    blogPosts.forEach(p => { if (p.media && p.media.startsWith('data:')) pending.push(p); });

    for (const entry of pending) {
        const dataUrl = entry.path || entry.media;
        const uploaded = await uploadDataUrl(token, owner, repo, dataUrl);
        if (uploaded) {
            if (entry.path) entry.path = uploaded;
            if (entry.media) entry.media = uploaded;
        }
    }
}

async function uploadDataUrl(token, owner, repo, dataUrl) {
    const m = dataUrl.match(/^data:([^;]+);base64,(.+)$/);
    if (!m) return null;
    const ext = (m[1].split('/')[1] || 'bin').replace('jpeg', 'jpg');
    const filename = 'uploads/' + Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    const url = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + filename;
    try {
        const res = await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'upload media: ' + filename, content: m[2] })
        });
        if (res.ok) return filename;
    } catch (e) { /* ignore */ }
    return null;
}
