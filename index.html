<html lang="ru">

            padding: 40px 20px;
        }
        header {
            max-width: 1400px;
            margin: 0 auto 40px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .nav-tabs {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .tab-btn {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .tab-btn:hover, .tab-btn.active {
            border-color: #fff;
            color: #fff;
        }
        /* Админ-панель */
        .admin-bar {
            display: none;
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 15px 20px;
            border-radius: 8px;
            max-width: 1400px;
            margin: 0 auto 30px auto;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        body.admin-mode .admin-bar {
            display: flex;
        }
        .admin-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .admin-btn.save { background: #4caf50; color: #fff; }
        .admin-btn.danger { background: #f44336; color: #fff; }
        
        /* Сетка портфолио */
        .portfolio-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }
        .card {
            background: #161616;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .card img, .card video {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }
        .card-meta {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title {
            font-size: 0.85rem;
            color: #aaa;
        }
        .del-card-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 10;
        }
        body.admin-mode .del-card-btn {
            display: flex;
        }
        .del-card-btn:hover { background: #f44336; }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .modal-content {
            background: #1a1a1a;
            width: 100%;
            max-width: 1000px;
            max-height: 80vh;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #333;
        }
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        .picker-item {
            background: #111;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #222;
            transition: border-color 0.2s;
        }
        .picker-item:hover { border-color: #fff; }
        .picker-item img, .picker-item video {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .picker-title {
            font-size: 0.75rem;
            padding: 8px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sortable-ghost { opacity: 0.4; }
        .del-section-btn {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            margin-left: 6px;
            font-size: 0.8rem;
        }
    </style>
</head>
