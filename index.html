<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOKIKORI — Portfolio & Album Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #f3f3f3;
            --muted-color: #888888;
            --card-bg: #141414;
            --accent: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            padding: 40px 20px;
        }

        header {
            max-width: 1400px;
            margin: 0 auto 40px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 20px;
        }

        .admin-controls {
            display: flex;
            gap: 10px;
        }

        button.btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        button.btn-primary { background: var(--accent); border-color: var(--accent); }
        button.btn:hover { opacity: 0.9; }

        .section-title {
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin: 40px 0 20px 0;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            aspect-ratio: 4/5;
            position: relative;
        }

        .card img, .card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Модалка Общей Лаборатории */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #18181b;
            width: 90%;
            max-width: 1000px;
            height: 80vh;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .media-picker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            overflow-y: auto;
            margin-top: 20px;
            flex-grow: 1;
        }

        .picker-item {
            aspect-ratio: 1;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
        }

        .picker-item.selected {
            border-color: var(--accent);
        }

        .picker-item img, .picker-item video {
            width: 100%; height: 100%; object-fit: cover;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>YOKIKORI</h1>
            <p style="color: var(--muted-color); font-size: 0.85rem;">Portfolio Management System</p>
        </div>
        <div class="admin-controls">
            <button class="btn btn-primary" onclick="createNewSection()">+ Новый раздел / Альбом</button>
            <button class="btn" onclick="openMediaLibrary()">📁 Общая лаба файлов</button>
        </div>
    </header>

    <main id="sections-container">
        <!-- Разделы будут динамически создаваться здесь -->
    </main>

    <!-- Модальное окно общей лаборатории -->
    <div class="modal" id="media-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Общая лаборатория медиафайлов</h3>
                <button class="btn" onclick="closeMediaLibrary()">Закрыть</button>
            </div>
            <div class="media-picker-grid" id="media-picker">
                <!-- Все 500+ файлов автоматически подгрузятся сюда -->
            </div>
        </div>
    </div>

    <script>
        let currentTargetSection = null;

        function createNewSection() {
            const title = prompt("Введите название нового альбома или раздела:");
            if (!title) return;

            const container = document.getElementById('sections-container');
            const section = document.createElement('div');
            section.className = 'portfolio-section';
            section.innerHTML = `
                <div class="section-title">
                    <span>${title}</span>
                    <button class="btn" onclick="attachMediaToSection(this)">+ Добавить фото/видео из лабы</button>
                </div>
                <div class="gallery-grid"></div>
            `;
            container.appendChild(section);
        }

        function openMediaLibrary() {
            document.getElementById('media-modal').style.display = 'flex';
        }

        function closeMediaLibrary() {
            document.getElementById('media-modal').style.display = 'none';
        }

        function attachMediaToSection(btn) {
            currentTargetSection = btn.closest('.portfolio-section').querySelector('.gallery-grid');
            openMediaLibrary();
        }
    </script>
</body>
</html>
