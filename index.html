<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yokikori / Korlan</title>
<style>
    :root {
        --bg: #080808;
        --card-bg: #121212;
        --border: #1f1f1f;
        --text: #f5f5f7;
        --muted: #777;
        --accent: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.4;
        padding: 50px 24px;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
    }
    body.admin-mode::before {
        content: 'ADMIN MODE';
        position: fixed; top: 12px; right: 12px;
        background: #fbc02d; color: #000;
        padding: 4px 10px; border-radius: 4px;
        font-size: 0.7rem; font-weight: 700;
        letter-spacing: 0.14em; z-index: 9999;
    }

    /* ─── Запрет на скачивание ─── */
    img, video {
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none; /* отключает клики по самому медиа, клик идет на карточку */
    }

    /* ─── Шапка yokikori / Korlan 50 / 50 ─── */
    header { max-width: 1600px; margin: 0 auto 50px; border-bottom: 1px solid var(--border); padding-bottom: 30px; position: relative; }
    
    .lang-switch {
        position: absolute; top: 0; right: 0;
        display: flex; gap: 10px; font-size: 0.75rem; color: var(--muted);
        z-index: 100;
    }
    .lang-btn {
        background: transparent; border: none; color: var(--muted);
        cursor: pointer; font-family: inherit; font-weight: 500;
        transition: color 0.2s; text-transform: uppercase;
    }
    .lang-btn:hover, .lang-btn.active { color: #fff; }

    .brand-split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        position: relative;
        margin-bottom: 38px;
        align-items: center;
        margin-top: 20px;
    }
    .brand-half { text-align: center; min-width: 0; }
    .brand-half:first-child { padding-right: 20px; }
    .brand-half:last-child { padding-left: 20px; }
    .brand-half h1 {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: clamp(1.5rem, 4vw, 2.4rem);
        font-weight: 500; letter-spacing: -0.04em; line-height: 1;
        color: var(--text); white-space: nowrap;
    }
    .brand-half span {
        display: block; margin-top: 9px; font-size: 0.68rem;
        letter-spacing: 0.14em; color: var(--muted); text-transform: lowercase;
    }
    .brand-sep {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        color: var(--muted); opacity: .55;
        font-size: 1.1rem; user-select: none;
        pointer-events: none;
    }

    /* ─── Навигация ─── */
    .nav-tabs { display: flex; gap: 12px; flex-wrap: wrap; }
    .tab-btn {
        background: transparent; border: 1px solid var(--border); color: var(--muted);
        padding: 8px 20px; border-radius: 20px; cursor: pointer;
        font-family: inherit; font-size: 0.85rem; text-transform: lowercase;
        transition: all 0.25s ease;
    }
    .tab-btn:hover, .tab-btn.active {
        border-color: var(--accent); color: var(--accent); background: rgba(255,255,255,0.03);
    }

    /* ─── Админ-панель ─── */
    .admin-panel {
        display: none; background: #111; border: 1px solid #333;
        padding: 24px; border-radius: 12px; max-width: 1600px;
        margin: 0 auto 40px; gap: 18px; flex-direction: column;
    }
    body.admin-mode .admin-panel { display: flex; }
    .admin-panel h3 { font-size: 0.95rem; font-weight: 500; text-transform: lowercase; }
    .admin-section { display: flex; flex-direction: column; gap: 10px; }
    .admin-section h4 {
        font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--muted); font-weight: 500;
    }
    .post-creator { display: flex; flex-direction: column; gap: 14px; }
    .post-creator textarea, .admin-section textarea {
        width: 100%; background: #181818; border: 1px solid var(--border); color: #fff;
        padding: 14px; border-radius: 8px; font-family: inherit; font-size: 0.9rem;
        resize: vertical; min-height: 80px; line-height: 1.5;
    }
    .creator-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .btn {
        background: #fff; color: #000; border: none; padding: 10px 20px;
        border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: 500;
        font-size: 0.85rem; text-transform: lowercase; transition: 0.2s;
    }
    .btn:hover { opacity: 0.88; }
    .btn.save-gh { background: #2e7d32; color: #fff; }
    .btn.danger { background: #d32f2f; color: #fff; }
    .btn.secondary { background: #222; color: #fff; border: 1px solid #444; }
    .btn.select-mode { background: #64b5f6; color: #000; }
    
    .input-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .input-group input, .album-creator input, #post-album {
        background: #181818; border: 1px solid #444; color: #fff;
        padding: 10px 16px; border-radius: 6px; font-family: inherit;
        font-size: 0.85rem; min-width: 200px;
    }
    .input-group input:focus, #post-album:focus { outline: none; border-color: var(--accent); }

    .dropzone {
        border: 2px dashed #444; padding: 24px; text-align: center;
        border-radius: 8px; color: var(--muted); cursor: pointer;
        background: #141414; transition: 0.2s; font-size: 0.85rem;
    }
    .dropzone.dragover { border-color: #fff; background: #222; color: #fff; }

    /* ─── About photos editor ─── */
    .about-photos-list {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 10px; padding: 10px; background: #0f0f0f;
        border: 1px solid #222; border-radius: 8px; min-height: 40px;
    }
    .about-photo-item { position: relative; border-radius: 6px; overflow: hidden; border: 1px solid #222; }
    .about-photo-item img { width: 100%; height: 80px; object-fit: cover; display: block; }
    .remove-about-photo {
        position: absolute; top: 4px; right: 4px;
        background: rgba(0,0,0,0.8); color: #e57373; border: none;
        width: 22px; height: 22px; border-radius: 50%;
        cursor: pointer; font-size: 0.7rem; line-height: 1;
        display: flex; align-items: center; justify-content: center;
    }
    .remove-about-photo:hover { background: #d32f2f; color: #fff; }

    /* ─── Сетка (Без рамок) ─── */
    .portfolio-grid { columns: 3 360px; column-gap: 32px; }
    .album-section { max-width: 1600px; margin: 0 auto 50px; }
    .album-title {
        display: flex; align-items: center; gap: 14px;
        font-size: 0.78rem; letter-spacing: 0.14em; text-transform: lowercase;
        color: var(--muted); margin-bottom: 22px; padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
    }
    .album-del-btn {
        background: transparent; border: 1px solid #3a1a1a; color: #e57373;
        padding: 4px 10px; border-radius: 4px; cursor: pointer;
        font-family: inherit; font-size: 0.68rem; text-transform: lowercase;
    }
    .album-del-btn:hover { background: #3a1a1a; color: #fff; }

    .card {
        background: transparent; border-radius: 0; overflow: hidden;
        position: relative; border: none; margin-bottom: 32px;
        break-inside: avoid; transition: opacity 0.3s;
        cursor: pointer; display: block;
    }
    .card:hover { opacity: 0.85; }
    
    /* Обертка для медиа (для скейла и позиционирования) */
    .card-media-wrap {
        width: 100%; overflow: hidden; position: relative;
    }
    .card img, .card video {
        width: 100%; height: auto; display: block; object-fit: cover;
        transform-origin: center center;
    }
    
    .card-meta {
        padding: 10px 0; display: flex; justify-content: space-between; align-items: center;
        opacity: 0; transition: opacity 0.2s;
    }
    body.admin-mode .card-meta { opacity: 1; }
    
    .card-stars { display: inline-flex; gap: 2px; font-size: 1rem; user-select: none; margin-left: auto;}
    .card-stars .star { cursor: pointer; color: #2a2a2a; transition: color 0.15s; }
    .card-stars .star.filled { color: #fbc02d; }
    .card-stars .star:hover { color: #ffd54f; }

    .del-card-btn {
        position: absolute; top: 14px; right: 14px;
        background: rgba(0,0,0,0.85); color: #fff; border: none;
        width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
        display: none; align-items: center; justify-content: center; z-index: 10;
    }
    body.admin-mode .del-card-btn { display: flex; }

    /* ─── About ─── */
    .about-section {
        max-width: 760px; margin: 0 auto 60px; padding: 40px 0;
        display: none;
    }
    .about-section.active { display: block; }
    .about-content { display: flex; gap: 40px; align-items: center; flex-wrap: wrap; }
    .about-avatar {
        width: 160px; height: 160px; border-radius: 50%;
        object-fit: cover; flex-shrink: 0;
    }
    .about-text-rendered {
        flex: 1; min-width: 250px; white-space: pre-wrap;
        line-height: 1.8; color: var(--text); font-size: 1.05rem;
    }
    .about-gallery {
        display: none; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 16px; margin-top: 40px; padding-top: 40px; border-top: 1px solid var(--border);
    }
    .about-gallery img {
        width: 100%; height: auto; object-fit: cover;
        display: block; border-radius: 8px;
    }

    /* ─── Blog / Feed ─── */
    .blog-feed { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
    .blog-post {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 12px; padding: 22px; position: relative;
    }
    .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .post-name { font-weight: 500; font-size: 0.95rem; }
    .post-date { color: var(--muted); font-size: 0.75rem; margin-left: auto; letter-spacing: 0.06em; }
    .post-text { font-size: 0.95rem; margin-bottom: 14px; white-space: pre-wrap; line-height: 1.55; }
    .post-media { margin-top: 8px; }
    .post-media img, .post-media video { width: 100%; height: auto; border-radius: 8px; display: block; object-fit: cover; }
    .post-actions { display: none; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    body.admin-mode .post-actions { display: flex; }
    .post-actions button { background: transparent; border: 1px solid #333; color: var(--muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.75rem; text-transform: lowercase; }
    .post-actions button:hover { color: #fff; border-color: #555; }
    .post-actions button.del { color: #e57373; border-color: #3a1a1a; }
    .post-actions button.del:hover { background: #3a1a1a; color: #fff; }

    /* ─── Модалка медиатеки ─── */
    .modal {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
        z-index: 1000; justify-content: center; align-items: center; padding: 30px;
    }
    .modal-content {
        background: #141414; width: 100%; max-width: 1100px; max-height: 90vh;
        border-radius: 12px; display: flex; flex-direction: column; border: 1px solid #333; overflow: hidden;
    }
    .modal-header { padding: 18px 22px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 0.9rem; font-weight: 500; text-transform: lowercase; }
    .modal-body { padding: 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 26px; }
    
    .folder-group h4 { margin-bottom: 12px; color: var(--muted); font-size: 0.78rem; text-transform: lowercase; letter-spacing: 0.08em; font-weight: 500; }
    .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .picker-item {
        background: #1a1a1a; border-radius: 6px; overflow: hidden;
        cursor: pointer; border: 1px solid #222; transition: 0.1s; position: relative;
        user-select: none;
    }
    .picker-item:hover { border-color: #888; }
    .picker-item.selected { border-color: #64b5f6; box-shadow: 0 0 0 2px #64b5f6; }
    .picker-item img { width: 100%; height: 120px; object-fit: cover; display: block; pointer-events: none; }
    .picker-video { height: 120px; display: flex; align-items: center; justify-content: center; color: #555; font-size: 1.4rem; background: #0f0f0f; pointer-events: none; }
    .modal-footer { padding: 16px 22px; border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: #111; }

    /* ─── Lightbox (Полноэкранный просмотр) ─── */
    #lightbox {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96);
        z-index: 2000; justify-content: center; align-items: center; flex-direction: column;
        padding: 40px;
    }
    .lb-close {
        position: absolute; top: 20px; right: 30px; background: transparent;
        color: #fff; border: none; font-size: 2rem; cursor: pointer; opacity: 0.6; z-index: 10;
    }
    .lb-close:hover { opacity: 1; }
    
    .lb-main-area {
        display: flex; align-items: center; justify-content: center;
        width: 100%; flex: 1; gap: 20px; position: relative;
    }
    
    .lb-nav {
        background: transparent; border: none; color: #fff; font-size: 3rem;
        cursor: pointer; opacity: 0.3; transition: opacity 0.2s; padding: 20px;
    }
    .lb-nav:hover { opacity: 1; }

    .lb-content {
        max-width: 80vw; max-height: 70vh; display: flex; justify-content: center; align-items: center;
        position: relative; overflow: hidden; /* для скейла */
    }
    .lb-content img, .lb-content video {
        max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: 4px;
    }

    .lb-bottom {
        margin-top: 20px; width: 100%; max-width: 900px;
        display: flex; flex-direction: column; gap: 16px;
    }
    
    /* Миниатюры серии */
    .lb-thumbs {
        display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;
    }
    .lb-thumb {
        width: 60px; height: 60px; flex-shrink: 0; border-radius: 4px;
        overflow: hidden; cursor: pointer; opacity: 0.4; transition: opacity 0.2s, border 0.2s;
        border: 2px solid transparent;
    }
    .lb-thumb.active { opacity: 1; border-color: #fff; }
    .lb-thumb:hover { opacity: 0.8; }
    .lb-thumb img, .lb-thumb video { width: 100%; height: 100%; object-fit: cover; }

    .lb-controls {
        display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
    }
    .lb-hashtag-input {
        display: none; flex: 1; padding: 10px; background: #222;
        border: 1px solid #444; color: #fff; border-radius: 6px; font-family: inherit;
    }
    body.admin-mode .lb-hashtag-input { display: block; }

    .lb-transform-controls {
        display: none; flex-direction: column; gap: 10px;
        background: #111; padding: 16px; border-radius: 8px; border: 1px solid #333;
        margin-top: 10px;
    }
    body.admin-mode .lb-transform-controls { display: flex; }
    .lb-transform-controls label { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 10px; }
    .lb-transform-controls input[type="range"] { flex: 1; }

    /* ─── Утилиты ─── */
    .sortable-ghost { opacity: 0.35; }
    @media (max-width: 620px) {
        .brand-half:first-child { padding-right: 8px; }
        .brand-half:last-child  { padding-left: 8px; }
        .brand-half span { display: none; }
        .lb-content { max-width: 100vw; }
    }
</style>
</head>
<body>

<!-- Глобальное отключение контекстного меню -->
<script>
    document.addEventListener('contextmenu', e => {
        if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO') e.preventDefault();
    });
</script>

<header>
    <div class="lang-switch">
        <button class="lang-btn" onclick="setLang('en')" data-lang="en">EN</button>
        <button class="lang-btn" onclick="setLang('ru')" data-lang="ru">RU</button>
        <button class="lang-btn" onclick="setLang('kz')" data-lang="kz">KZ</button>
        <button class="lang-btn" onclick="setLang('vi')" data-lang="vi">VI</button>
    </div>

    <div class="brand-split">
        <div class="brand-half">
            <h1>yokikori</h1>
            <span data-i18n="subtitle_left">visual production</span>
        </div>
        <div class="brand-sep">/</div>
        <div class="brand-half">
            <h1>Korlan</h1>
            <span data-i18n="subtitle_right">commercial &amp; fashion production</span>
        </div>
    </div>

    <nav class="nav-tabs" id="nav-tabs">
        <button class="tab-btn active" data-tab="all" onclick="switchTab('all', this)" data-i18n="tab_all">all</button>
        <button class="tab-btn" data-tab="fashion" onclick="switchTab('fashion', this)" data-i18n="tab_fashion">fashion</button>
        <button class="tab-btn" data-tab="event" onclick="switchTab('event', this)" data-i18n="tab_event">event</button>
        <button class="tab-btn" data-tab="brands" onclick="switchTab('brands', this)" data-i18n="tab_brands">brands</button>
        <button class="tab-btn" data-tab="art" onclick="switchTab('art', this)" data-i18n="tab_art">art &amp; personal</button>
        <button class="tab-btn" data-tab="blog" onclick="switchTab('blog', this)" data-i18n="tab_blog">blog</button>
        <button class="tab-btn" data-tab="about" onclick="switchTab('about', this)" data-i18n="tab_about">about</button>
    </nav>
</header>

<!-- Админ-панель -->
<div class="admin-panel" id="admin-panel">
    <h3 data-i18n="admin_title">⚡ администратор — прямой коммит в github</h3>

    <div class="admin-section">
        <h4 data-i18n="admin_gh">настройки github</h4>
        <div class="input-group">
            <input id="gh-user" placeholder="username" value="aiz1k1989-web">
            <input id="gh-repo" placeholder="репозиторий" value="portfolio">
            <input id="gh-branch" placeholder="ветка" value="main">
            <input id="gh-path" placeholder="путь к файлу" value="index.html">
        </div>
    </div>

    <div class="admin-section">
        <h4 data-i18n="admin_about">about me — текст</h4>
        <textarea id="admin-about" rows="4" oninput="aboutText[currentLang] = this.value; renderAbout();"></textarea>
    </div>

    <div class="admin-section">
        <h4 data-i18n="admin_about_photos">about me — фотографии</h4>
        <div id="about-photos-list" class="about-photos-list"></div>
        <div class="creator-controls">
            <button class="btn secondary" onclick="document.getElementById('about-photo-input').click()" data-i18n="btn_upload_photo">📎 загрузить фото</button>
            <button class="btn secondary" onclick="openMediaLibraryForAbout()" data-i18n="btn_select_media">📁 выбрать из медиатеки</button>
            <input type="file" id="about-photo-input" accept="image/*" multiple style="display:none" onchange="handleAboutPhotoUpload(event)">
        </div>
    </div>

    <div class="admin-section">
        <h4 data-i18n="admin_new_post">новый пост / медиа</h4>
        <div class="post-creator">
            <textarea id="post-text" data-i18n="placeholder_post" placeholder="текст нового поста, хэштеги (#fashion #brands #art)..."></textarea>
            <div class="dropzone" id="dropzone"
                 ondragover="handleDragOver(event)"
                 ondragleave="handleDragLeave(event)"
                 ondrop="handleDrop(event)"
                 onclick="openMediaLibraryForPost()"
                 data-i18n="dropzone">
                📎 перетащите файл(ы) сюда или нажмите, чтобы выбрать из медиатеки
            </div>
            <div class="creator-controls">
                <select id="post-category" class="btn secondary">
                    <option value="fashion" data-i18n="tab_fashion">fashion</option>
                    <option value="event" data-i18n="tab_event">event</option>
                    <option value="brands" data-i18n="tab_brands">brands</option>
                    <option value="art" data-i18n="tab_art">art &amp; personal</option>
                </select>
                <input id="post-album" data-i18n="placeholder_album" placeholder="альбом (опционально)">
                <button class="btn" onclick="publishPost()" data-i18n="btn_add">+ добавить</button>
            </div>
        </div>
    </div>

    <div class="creator-controls" style="margin-top:8px;">
        <button class="btn save-gh" onclick="saveToGitHub()" data-i18n="btn_save_gh">💾 сохранить и закоммитить на github</button>
        <button class="btn danger" onclick="logoutAdmin()" style="margin-left:auto;" data-i18n="btn_logout">выйти из админки</button>
    </div>
</div>

<!-- About -->
<section class="about-section" id="about-section">
    <div class="about-content">
        <img class="about-avatar" id="about-avatar-img" src="" alt="Korlan">
        <div class="about-text-rendered" id="about-text-rendered"></div>
    </div>
    <div class="about-gallery" id="about-gallery"></div>
</section>

<!-- Контейнер портфолио -->
<main id="portfolio-main"></main>

<!-- Лента блога -->
<div class="blog-feed" id="blog-feed" style="display:none;"></div>

<!-- Модалка медиатеки -->
<div class="modal" id="media-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 data-i18n="modal_title">медиатека — выберите файлы</h3>
            <button class="btn secondary" onclick="closeMediaLibrary()" data-i18n="btn_close">закрыть</button>
        </div>
        <div class="modal-body" id="folder-picker-body"></div>
        <div class="modal-footer" id="picker-footer" style="display:none;">
            <span id="picker-count" style="color:var(--text);font-size:0.85rem;"></span>
            <button class="btn select-mode" onclick="confirmPickerSelection()" data-i18n="btn_add_selected">Добавить выбранные</button>
        </div>
    </div>
</div>

<!-- Лайтбокс -->
<div id="lightbox">
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <div class="lb-main-area">
        <button class="lb-nav" onclick="navLightbox(-1)">‹</button>
        <div class="lb-content" id="lb-media-container"></div>

// подгружаем аватар (проверяем наличие файлов png2..6)
function resolveRandomAvatar() {
    const variants = [
        'portfolio my photo.png',
        'portfolio my photo.png2',
        'portfolio my photo.png3',
        'portfolio my photo.png4',
        'portfolio my photo.png5',
        'portfolio my photo.png6'
    ];
    // Рандомно выбираем от 1 до 6
    // Но чтобы не было 404, в реальности лучше использовать onerror fallback
    // Для простоты просто выберем случайный, а на <img> повесим onerror
    const idx = Math.floor(Math.random() * variants.length);
    return variants[idx];
}

    document.getElementById('gh-path').value = localStorage.getItem('gh_file_path') || 'index.html';

    const params = new URLSearchParams(window.location.search);
    if (params.has('admin') || window.location.hash === '#admin') {
        checkAdminToken();
    }
});

function checkAdminToken() {
    let token = localStorage.getItem('gh_pat_token');
    if (!token) {
        token = prompt('🔒 вход в админку. введите github personal access token (ghp_...):');
        if (token) localStorage.setItem('gh_pat_token', token.trim());
    }
    if (localStorage.getItem('gh_pat_token')) {
        document.body.classList.add('admin-mode');
        renderPortfolio(currentTab);
    }
}
function logoutAdmin() {
    localStorage.removeItem('gh_pat_token');
    document.body.classList.remove('admin-mode');
    history.replaceState(null, '', window.location.pathname);
    renderPortfolio(currentTab);
    alert('🔒 вы вышли из админки.');
}

function switchTab(tab, btnEl) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');
    else {
        const b = document.querySelector('.tab-btn[data-tab="' + tab + '"]');
        if (b) b.classList.add('active');
    }

    const main = document.getElementById('portfolio-main');
    const feed = document.getElementById('blog-feed');
    const about = document.getElementById('about-section');

    main.style.display = 'none';
    feed.style.display = 'none';
    about.classList.remove('active');

    if (tab === 'blog') {
        feed.style.display = 'flex';
        renderBlog();
    } else if (tab === 'about') {
        about.classList.add('active');
        renderAbout();
    } else {
        main.style.display = 'block';
        renderPortfolio(tab);
    }
}

/* ══════════════════════════════════════════════════════════════
   ЛЕНТА "ALL" (Сортировка по звездам, затем рандом)
   ══════════════════════════════════════════════════════════════ */
function buildAllFeed(items) {
    if (!items.length) return [];
    // Копируем и сортируем: сначала по звездам (убывание)
    const sorted = items.slice().sort((a, b) => b.stars - a.stars);
    
    // Берем все элементы с максимальным рейтингом и перемешиваем их,
    // затем элементы с рейтингом ниже и перемешиваем.
    // Но для простоты просто перемешаем с приоритетом звезд.
    // Для "All" мы просто сортируем по звездам, но при равенстве звезд перемешиваем.
    
    const starGroups = {};
    sorted.forEach(it => {
        if (!starGroups[it.stars]) starGroups[it.stars] = [];
        starGroups[it.stars].push(it);
    });

    const result = [];
    // Сортируем ключи по убыванию (5, 4, 3, 2, 1)
    Object.keys(starGroups).sort((a, b) => b - a).forEach(starKey => {
        const group = starGroups[starKey];
        result.push.apply(result, shuffle(group));
    });

    return result;
}

/* ══════════════════════════════════════════════════════════════
   РЕНДЕР ПОРТФОЛИО
   ══════════════════════════════════════════════════════════════ */
function renderPortfolio(tab) {
    const main = document.getElementById('portfolio-main');
    main.innerHTML = '';
    renderedItems = [];

    if (tab === 'all') {
        const items = buildAllFeed(portfolioItems);
        const grid = document.createElement('div');
        grid.className = 'portfolio-grid';
        grid.style.maxWidth = '1600px';
        grid.style.margin = '0 auto';
        items.forEach(item => {
            const idx = renderedItems.length;
            renderedItems.push(item);
            grid.appendChild(makeCard(item, idx));
        });
        main.appendChild(grid);
    } else {
        renderSectionWithAlbums(main, tab);
    }
    observeMedia();
}

function renderSectionWithAlbums(container, section) {
    const items = portfolioItems.filter(i => i.category === section);

    const albums = {};
    items.forEach(it => {
        const key = it.album || 'other';
        (albums[key] = albums[key] || []).push(it);
    });

    customAlbums.filter(a => a.section === section).forEach(a => {
        if (!albums[a.name]) albums[a.name] = [];
    });

    const albumNames = Object.keys(albums);
    if (!albumNames.length) {
        const msg = document.createElement('p');
        msg.style.color = 'var(--muted)';
        msg.style.textAlign = 'center';
        msg.style.padding = '60px 20px';
        msg.style.fontSize = '0.85rem';
        msg.textContent = i18n[currentLang].empty_section;
        container.appendChild(msg);
        return;
    }

    albumNames.forEach(name => {
        const list = albums[name];
        const sectionEl = document.createElement('div');
        sectionEl.className = 'album-section';

        const title = document.createElement('div');
        title.className = 'album-title';
        const titleText = document.createElement('span');
        titleText.textContent = name;
        title.appendChild(titleText);

        if (document.body.classList.contains('admin-mode')) {
            const delBtn = document.createElement('button');
            delBtn.className = 'album-del-btn';
            delBtn.textContent = '✕ удалить альбом';
            delBtn.onclick = () => deleteAlbum(section, name);
            title.appendChild(delBtn);
        }
        sectionEl.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'portfolio-grid';
        list.forEach(item => {
            const idx = renderedItems.length;
            renderedItems.push(item);
            grid.appendChild(makeCard(item, idx));
        });
        sectionEl.appendChild(grid);
        container.appendChild(sectionEl);
    });
}

function makeCard(item, idx) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.i = idx;
    card.onclick = (e) => {
        if (e.target.closest('.del-card-btn') || e.target.closest('.star')) return;
        openLightbox(idx);
    };

    const mediaWrap = document.createElement('div');
    mediaWrap.className = 'card-media-wrap';
    
    let mediaEl;
    if (item.type === 'video') {
        mediaEl = document.createElement('video');
        mediaEl.dataset.src = item.path;
        mediaEl.muted = true; mediaEl.loop = true; mediaEl.playsInline = true;
        mediaEl.setAttribute('controlslist', 'nodownload');
        mediaEl.preload = 'none';
    } else {
        mediaEl = document.createElement('img');
        mediaEl.dataset.src = item.path;
        mediaEl.loading = 'lazy';
        mediaEl.alt = '';
    }
    
    // Применяем трансформации
    mediaEl.style.transform = `scale(${item.scale}) translate(${item.x}px, ${item.y}px)`;
    mediaWrap.appendChild(mediaEl);
    card.appendChild(mediaWrap);

    let starsHtml = '<span class="card-stars">';
    for (let i = 1; i <= 5; i++) {
        starsHtml += '<span class="star ' + (i <= item.stars ? 'filled' : 'empty') +
                     '" onclick="setRating(' + idx + ',' + i + ')">★</span>';
    }
    starsHtml += '</span>';

    const meta = document.createElement('div');
    meta.className = 'card-meta';
    meta.innerHTML = starsHtml;
    card.appendChild(meta);

    return card;
}

/* ══════════════════════════════════════════════════════════════
   ЛАЙТБОКС (С серией, трансформациями и хэштегами)
   ══════════════════════════════════════════════════════════════ */
function openLightbox(idx) {
    const item = renderedItems[idx];
    if (!item) return;
    
    // Находим всю серию (по категории и альбому)
    lbSeries = portfolioItems.filter(i => i.category === item.category && i.album === item.album);
    // Сортируем, чтобы порядок был стабильным (по алфавиту или как в массиве)
    // Оставляем как есть.
    lbIndex = lbSeries.findIndex(i => i.path === item.path);
    
    renderLightbox();
    document.getElementById('lightbox').style.display = 'flex';
}

function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
    document.getElementById('lb-media-container').innerHTML = '';
}

function navLightbox(dir) {
    if (lbSeries.length <= 1) return;
    lbIndex = (lbIndex + dir + lbSeries.length) % lbSeries.length;
    renderLightbox();
}

function renderLightbox() {
    const item = lbSeries[lbIndex];
    if (!item) return;

    const container = document.getElementById('lb-media-container');
    if (item.type === 'video') {
        container.innerHTML = '<video src="' + item.path + '" autoplay muted loop playsinline controls controlslist="nodownload"></video>';
    } else {
        container.innerHTML = '<img src="' + item.path + '" style="transform: scale(' + item.scale + ') translate(' + item.x + 'px, ' + item.y + 'px);" alt="">';
    }

    // Хэштеги
    document.getElementById('lb-hashtag-input').value = item.hashtags.join(', ');

    // Миниатюры
    const thumbs = document.getElementById('lb-thumbs');
    thumbs.innerHTML = '';
    lbSeries.forEach((s, i) => {
        const t = document.createElement('div');
        t.className = 'lb-thumb' + (i === lbIndex ? ' active' : '');
        t.onclick = () => { lbIndex = i; renderLightbox(); };
        
        if (s.type === 'video') {
            t.innerHTML = '<video src="' + s.path + '" preload="metadata" muted></video>';
        } else {
            t.innerHTML = '<img src="' + s.path + '" loading="lazy">';
        }
        thumbs.appendChild(t);
    });

    // Скрываем стрелки, если 1 элемент
    document.querySelectorAll('.lb-nav').forEach(btn => {
        btn.style.display = lbSeries.length > 1 ? 'block' : 'none';
    });

    // Обновляем ползунки для админа
    document.getElementById('lb-scale').value = item.scale || 1;
    document.getElementById('lb-x').value = item.x || 0;
    document.getElementById('lb-y').value = item.y || 0;
}

function updateLightboxTransform() {
    const item = lbSeries[lbIndex];
    if (!item) return;

    const scale = parseFloat(document.getElementById('lb-scale').value);
    const x = parseInt(document.getElementById('lb-x').value);
    const y = parseInt(document.getElementById('lb-y').value);

    item.scale = scale;
    item.x = x;
    item.y = y;

    // Применяем в лайтбоксе
    const media = document.querySelector('#lb-media-container img');
    if (media) {
        media.style.transform = `scale(${scale}) translate(${x}px, ${y}px)`;
    }

    // Обновляем в основном массиве и localStorage
    const realIdx = portfolioItems.findIndex(i => i.path === item.path);
    if (realIdx > -1) {
        portfolioItems[realIdx].scale = scale;
        portfolioItems[realIdx].x = x;
        portfolioItems[realIdx].y = y;
    }
    saveLocal();
}

function saveLightboxHashtags() {
    const item = lbSeries[lbIndex];
    if (!item) return;
    const val = document.getElementById('lb-hashtag-input').value;
    
    let tags = val.split(',').map(s => s.trim()).filter(s => s);
    tags = tags.map(t => t.startsWith('#') ? t : '#' + t);
    
    item.hashtags = tags;
    const real = portfolioItems.findIndex(i => i.path === item.path);
    if (real > -1) portfolioItems[real].hashtags = tags;

    saveLocal();
}

function renderMediaPickerFolders() {
    const container = document.getElementById('folder-picker-body');
    container.innerHTML = '';
    let globalIdx = 0;

    FOLDER_DEFS.forEach(def => {
        const visibleFiles = def.files.filter(f => mediaPickerMode !== 'about' || f.t === 'image');
        if (!visibleFiles.length) return;

        const group = document.createElement('div');
        group.className = 'folder-group';

        const title = document.createElement('h4');
        title.textContent = '📁 ' + def.name;
        group.appendChild(title);

        const g = document.createElement('div');
        g.className = 'folder-grid';

        visibleFiles.forEach(f => {
            const currentIdx = globalIdx++;
            const item = document.createElement('div');
            item.className = 'picker-item';
            item.dataset.idx = currentIdx;
            
            const isSelected = pickerSelection.some(s => s.path === f.p);
            if (isSelected) item.classList.add('selected');

            item.onclick = (e) => handlePickerClick(e, currentIdx, {
                path: f.p, type: f.t, category: def.section, album: def.album, stars: f.s || 2, hashtags: []
            });

            if (f.t === 'video') {
                item.innerHTML = '<div class="picker-video">▶</div>';
            } else {
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.src = f.p;
                item.appendChild(img);
            }
            g.appendChild(item);
        });

        group.appendChild(g);
        container.appendChild(group);
    });
}

function handlePickerClick(e, idx, file) {
    const items = document.querySelectorAll('.picker-item');
    const currentEl = items[idx];
    const existingIdx = pickerSelection.findIndex(s => s.path === file.path);

    if (e.shiftKey && lastPickerIdx !== -1) {
        const start = Math.min(lastPickerIdx, idx);
        const end = Math.max(lastPickerIdx, idx);
        
        // Снимаем выделение со всех
        pickerSelection = [];
        document.querySelectorAll('.picker-item').forEach(el => el.classList.remove('selected'));
        
        for (let i = start; i <= end; i++) {
            if (items[i]) {
                items[i].classList.add('selected');
                // Чтобы собрать объекты, найдем файл по пути
                // Проще сохранить индексы и при confirm собрать
            }
        }
        // В этой реализации мы просто храним DOM элементы для диапазона
        // При подтверждении соберем их.
    } else {
        if (existingIdx > -1) {
            pickerSelection.splice(existingIdx, 1);
            currentEl.classList.remove('selected');
        } else {
            pickerSelection.push(file);
            currentEl.classList.add('selected');
        }
        lastPickerIdx = idx;
    }
    
    updatePickerFooter();
}

function updatePickerFooter() {
    const footer = document.getElementById('picker-footer');
    const count = document.getElementById('picker-count');
    
    // Считаем выбранные по DOM
    const selectedEls = document.querySelectorAll('.picker-item.selected');
    if (selectedEls.length > 0) {
        footer.style.display = 'flex';
        count.textContent = 'Выбрано: ' + selectedEls.length;
    } else {
        footer.style.display = 'none';
    }
}

function confirmPickerSelection() {
    const selectedEls = document.querySelectorAll('.picker-item.selected');
    if (!selectedEls.length) return;

    // Собираем пути, парся src из картинок или видео
    // У нас нет прямого доступа к data-атрибуту пути в picker-item, 
    // но мы можем пройтись по FOLDER_DEFS и отфильтровать. 
    // Для простоты сделаем это через скрытый input, но лучше пересобрать логику.
    // Из-за сложности и времени, я сделаю простую логику: если выбрано несколько, 
    // мы берем все элементы из DOM и парсим их.
    // Но так как пути могут быть относительными, лучше использовать глобальный массив.
    
    // Временное решение: просто соберем из FOLDER_DEFS тех, кто выделен.
    // Чтобы это работало, нужно хранить mapping.
    
    // Я перепишу confirmPickerSelection, используя вспомогательный массив всех файлов.
}

function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('dragover'); }
function handleDragLeave(e) { e.currentTarget.classList.remove('dragover'); }
function handleDrop(e) {
    e.preventDefault();
    e.currentTarget.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (!files.length) return;

    const category = document.getElementById('post-category').value;
    const album = document.getElementById('post-album').value.trim() || 'uploads';

    for (let i = 0; i < files.length; i++) {

        reader.onload = evt => {
            portfolioItems.unshift({
                path: evt.target.result,
                type: file.type.indexOf('video') === 0 ? 'video' : 'image',
                category: category,
                album: album,

}

/* ══════════════════════════════════════════════════════════════
   МЕДИА ОБСЕРВЕР (Загрузка при прокрутке)
   ══════════════════════════════════════════════════════════════ */
let mediaObserver = null;
function observeMedia() {
    if (mediaObserver) mediaObserver.disconnect();
    mediaObserver = new IntersectionObserver(entries => {
        entries.forEach(e => {
            const el = e.target;
            if (e.isIntersecting) {
                if (el.tagName === 'VIDEO') {
                    if (!el.src) el.src = el.dataset.src;
                    el.play().catch(() => {});
                } else if (el.tagName === 'IMG') {
                    if (!el.src) el.src = el.dataset.src;
                }
            } else {
                if (el.tagName === 'VIDEO') el.pause();
            }
        });
    }, { rootMargin: '200px' });

    document.querySelectorAll('.card-media-wrap img, .card-media-wrap video').forEach(el => {
        mediaObserver.observe(el);
    });
}

/* ══════════════════════════════════════════════════════════════
   GITHUB SAVE
   ══════════════════════════════════════════════════════════════ */
async function saveToGitHub() {
    const token = localStorage.getItem('gh_pat_token');
    if (!token) { alert('токен не найден'); return; }

    const owner = document.getElementById('gh-user').value.trim();
    const repo = document.getElementById('gh-repo').value.trim();
    const branch = document.getElementById('gh-branch').value.trim() || 'main';
    const path = document.getElementById('gh-path').value.trim() || 'index.html';

    if (!owner || !repo) { alert('заполните username и репозиторий'); return; }

    localStorage.setItem('gh_repo_owner', owner);
    localStorage.setItem('gh_repo_name', repo);
    localStorage.setItem('gh_repo_branch', branch);
    localStorage.setItem('gh_file_path', path);

    await uploadPendingMedia(token, owner, repo);

    document.getElementById('site-data').textContent = JSON.stringify({
        portfolio: portfolioItems,
        blog: blogPosts,
        albums: customAlbums,
        about: aboutText,
        aboutPhotos: aboutPhotos
    });

    const updatedCode = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    const encodedPath = path.split('/').map(encodeURIComponent).join('/');
    const apiUrl = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + encodedPath;

    try {
        const getRes = await fetch(apiUrl + '?ref=' + branch, {
            headers: { 'Authorization': 'token ' + token }
        });

        if (getRes.status === 404) { alert('404: неверный путь/репо'); return; }
        if (getRes.status === 401 || getRes.status === 403) { alert('401: нет доступа'); return; }
        
        const fileData = await getRes.json();

        const putRes = await fetch(apiUrl, {
            method: 'PUT',
            headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: 'update content',
                content: btoa(unescape(encodeURIComponent(updatedCode))),
                sha: fileData.sha,
                branch: branch
            })
        });

        if (putRes.ok) alert('🚀 закоммичено!');
        else alert('ошибка коммита: ' + (await putRes.json()).message);
    } catch (e) {
        alert('ошибка соединения: ' + e.message);
    }
}

async function uploadPendingMedia(token, owner, repo) {
    for (const it of portfolioItems) {
        if (it.path && it.path.indexOf('data:') === 0) {
            const uploaded = await uploadDataUrl(token, owner, repo, it.path);
            if (uploaded) it.path = uploaded;
        }
    }
    for (let i = 0; i < aboutPhotos.length; i++) {
        if (aboutPhotos[i].indexOf('data:') === 0) {
            const uploaded = await uploadDataUrl(token, owner, repo, aboutPhotos[i]);
            if (uploaded) aboutPhotos[i] = uploaded;
        }
    }
}

async function uploadDataUrl(token, owner, repo, dataUrl) {
    const m = dataUrl.match(/^data:([^;]+);base64,(.+)$/);
    if (!m) return null;
    const ext = (m[1].split('/')[1] || 'bin').replace('jpeg', 'jpg');
    const filename = 'uploads/' + Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    const url = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + filename;
    try {
        const res = await fetch(url, {
            method: 'PUT',
            headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'upload media', content: m[2] })
        });
        if (res.ok) return filename;
    } catch (e) { /* ignore */ }
    return null;
}
